<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>UniFlow — Outil d'insertion de données</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; display: flex; height: 100vh; background: #F3F4F6; }
  #sidebar { width: 280px; background: #1E3A8A; color: white; overflow-y: auto; padding: 16px; }
  #sidebar h2 { font-size: 14px; opacity: 0.7; margin: 16px 0 6px; text-transform: uppercase; }
  #sidebar button { display: block; width: 100%; text-align: left; background: none; border: none; color: white;
    padding: 8px 10px; cursor: pointer; border-radius: 6px; margin-bottom: 2px; }
  #sidebar button:hover, #sidebar button.active { background: #0D9488; }
  #main { flex: 1; padding: 24px; overflow-y: auto; }
  #login-box { max-width: 360px; margin: 80px auto; background: white; padding: 24px; border-radius: 10px; }
  #login-box input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; }
  #login-box button { width: 100%; padding: 10px; background: #1E3A8A; color: white; border: none;
    border-radius: 6px; cursor: pointer; margin-top: 10px; }
  form label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
  form input, form select, form textarea {
    width: 100%; max-width: 480px; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px;
  }
  form button[type=submit] {
    margin-top: 20px; background: #0D9488; color: white; border: none; padding: 10px 20px;
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  .msg { padding: 10px; border-radius: 6px; margin-top: 16px; max-width: 480px; }
  .msg.ok { background: #d1fae5; color: #065f46; }
  .msg.err { background: #fee2e2; color: #991b1b; }
  #logout { position: absolute; top: 16px; right: 24px; cursor: pointer; color: #666; }
</style>
</head>
<body>

<div id="login-box">
  <h2>Connexion</h2>
  <input id="login-email" placeholder="Email" />
  <input id="login-password" type="password" placeholder="Mot de passe" />
  <button id="login-btn">Se connecter</button>
  <div id="login-msg"></div>
</div>

<div id="app" style="display:none; width:100%; display:flex;">
  <div id="sidebar"><div id="table-list">Chargement…</div></div>
  <div id="main">
    <span id="logout">Se déconnecter</span>
    <h1 id="form-title">Sélectionne une table à gauche</h1>
    <form id="dynamic-form" style="display:none"></form>
    <div id="result-msg"></div>
  </div>
</div>

<script src="/admin-tool-ui/admin.js"></script>
</body>
</html>
